name: inventario_qr
description: Sistema de inventario multi-artículo bajo modelo QR con restricciones
publish_to: 'none'
version: 1.0.2+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Gestión de estado
  provider: ^6.1.5
  # Persistencia de datos locales
  shared_preferences: ^2.2.0
  # Manejo de Excel - Compatible con Web, Windows y móviles
  excel: ^4.0.6  # Para importación Y exportación real de Excel
  file_picker: ^10.2.0
  path_provider: ^2.1.2
  # Web: ya no se requiere 'web' ni 'js'; excel maneja web nativamente
  # Abrir archivos
  open_file: ^3.5.10
  # Google Fonts
  google_fonts: ^8.1.0
  # Gráficas para visualización de datos
  syncfusion_flutter_charts: ^30.1.42
  # Iconos Unicons
  unicons: ^3.0.0
  # Tabla avanzada con edición Excel
  pluto_grid: ^8.0.0
  # Formato de números/moneda
  intl: ^0.19.0
  # Fallback puro Dart para parsear XLSX en Web cuando falle 'excel'
  archive: ^3.6.1
  xml: ^6.5.0
  # Render de fórmulas matemáticas (LaTeX) multiplataforma
  flutter_math_fork: ^0.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 🎨 Generador automático de iconos para web y Windows
  flutter_launcher_icons: ^0.13.1
  msix: ^3.16.5

flutter:
  uses-material-design: true
  
  # Incluir assets del proyecto
  assets:
    - assets/templates/
    - assets/templates/plantilla_inventario.xlsx

# 🎨 Configuración automática de iconos para web y Windows
flutter_launcher_icons:
  # 🖼️ Icono principal para todas las plataformas
  image_path: "assets/icons/appicon.png"
  
  # 🌐 WEB - Con colores de tu tema MDSJ
  web:
    generate: true
    image_path: "assets/icons/appicon.png"
    background_color: "#104152"  # MDSJ primary
    theme_color: "#114C5F"       # MDSJ secondary
    maskable: true               # Icono adaptativo para PWA
  
  # 🪟 WINDOWS - Tu plataforma principal
  windows:
    generate: true
    image_path: "assets/icons/appicon.png"
    icon_size: 48
    generate_ico: true           # Generar .ico para Windows
