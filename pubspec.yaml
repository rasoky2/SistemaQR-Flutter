name: inventario_qr
description: Sistema de inventario multi-artículo bajo modelo QR con restricciones
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Gestión de estado
  provider: ^6.1.5
  # Manejo de Excel - Compatible con Web, Windows y móviles
  excel: ^4.0.6  # Para importación Y exportación real de Excel
  file_picker: ^10.2.0
  path_provider: ^2.1.2
  # Web: ya no se requiere 'web' ni 'js'; excel maneja web nativamente
  # Abrir archivos
  open_file: ^3.5.10
  # Google Fonts
  google_fonts: ^6.3.0
  # Gráficas para visualización de datos
  syncfusion_flutter_charts: ^30.1.42
  # Iconos Unicons
  unicons: ^3.0.0
  # Tabla avanzada con edición Excel
  pluto_grid: ^8.0.0
  # Fallback puro Dart para parsear XLSX en Web cuando falle 'excel'
  archive: ^3.6.1
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  # Incluir assets del proyecto
  assets:
    - assets/templates/
    - assets/templates/plantilla_inventario.xlsx
